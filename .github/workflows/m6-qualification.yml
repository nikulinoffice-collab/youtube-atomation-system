name: M6 Qualification

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'M6 milestone test suite'
        required: true
        default: 'm6.8'
        type: choice
        options: [m6.1, m6.2, m6.3, m6.4, m6.5, m6.6, m6.7, m6.8, m6.9]
  push:
    branches: [factory-v1-voice-m6]
    paths:
      - 'scripts/m6_*.py'
      - 'config/m6/**'
      - 'tests/test_m6_*.py'
      - '.github/workflows/m6-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install pytest
      - name: Record qualification identity
        run: |
          echo "M6 milestone: ${{ inputs.milestone || 'm6.8' }}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify M6.1
        if: ${{ inputs.milestone == 'm6.1' }}
        run: python -m pytest -q tests/test_m6_voice_script.py
      - name: Qualify M6.2 and M6.1 regression
        if: ${{ inputs.milestone == 'm6.2' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py
      - name: Qualify M6.3 with M6.1-M6.2 regressions
        if: ${{ inputs.milestone == 'm6.3' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py
      - name: Qualify M6.4 with M6.1-M6.3 regressions
        if: ${{ inputs.milestone == 'm6.4' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py
      - name: Qualify M6.5 with M6.1-M6.4 regressions
        if: ${{ inputs.milestone == 'm6.5' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py tests/test_m6_block_renderer.py
      - name: Qualify M6.6 with M6.1-M6.5 regressions
        if: ${{ inputs.milestone == 'm6.6' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py tests/test_m6_block_renderer.py tests/test_m6_mastering.py
      - name: Qualify M6.7 with M6.1-M6.6 regressions
        if: ${{ inputs.milestone == 'm6.7' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py tests/test_m6_block_renderer.py tests/test_m6_mastering.py tests/test_m6_alignment.py
      - name: Qualify M6.8 QC/review package with M6.1-M6.7 regressions
        if: ${{ (inputs.milestone || 'm6.8') == 'm6.8' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py tests/test_m6_block_renderer.py tests/test_m6_mastering.py tests/test_m6_alignment.py tests/test_m6_qc.py tests/test_m6_review_package.py

      - name: Qualify M6.9 production migration gate with M6.1-M6.8 regressions
        if: ${{ inputs.milestone == 'm6.9' }}
        run: python -m pytest -q tests/test_m6_voice_script.py tests/test_m6_voice_plan.py tests/test_m6_voice_plan_validator.py tests/test_m6_tts_adapter.py tests/test_m6_qwen3_adapter.py tests/test_m6_block_renderer.py tests/test_m6_mastering.py tests/test_m6_alignment.py tests/test_m6_qc.py tests/test_m6_review_package.py tests/test_m6_production_gate.py
