name: M6 Qualification

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'M6 milestone test suite'
        required: true
        default: 'm6.1'
        type: choice
        options:
          - m6.1
  push:
    branches:
      - factory-v1-voice-m6
    paths:
      - 'scripts/m6_voice_script.py'
      - 'config/m6/**'
      - 'tests/test_m6_voice_script.py'
      - '.github/workflows/m6-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install pytest
      - name: Record qualification identity
        run: |
          echo "M6 milestone: ${{ inputs.milestone || 'm6.1' }}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Qualify M6.1
        if: ${{ (inputs.milestone || 'm6.1') == 'm6.1' }}
        run: python -m pytest -q tests/test_m6_voice_script.py
