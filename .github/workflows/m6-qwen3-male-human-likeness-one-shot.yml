name: M6 Qwen3 Male Human Likeness One Shot
on:
  workflow_dispatch:
  push:
    branches: [factory-v1-voice-m6]
    paths: [.github/workflows/m6-qwen3-male-human-likeness-one-shot.yml]
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-v1-voice-m6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System audio dependency
        run: sudo apt-get update && sudo apt-get install -y sox libsox-fmt-all
      - name: Install CPU-only Qwen3-TTS
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install git+https://github.com/QwenLM/Qwen3-TTS.git@022e286b98fbec7e1e916cb940cdf532cd9f488e soundfile psutil
          python -m pip check
      - name: Synthesize bounded male-only human-likeness set
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,resource
          from pathlib import Path
          import torch,soundfile as sf
          from qwen_tts import Qwen3TTSModel
          assert not torch.cuda.is_available()
          out=Path("artifacts/m6/qwen3-male"); out.mkdir(parents=True,exist_ok=True)
          model_id="Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
          model=Qwen3TTSModel.from_pretrained(model_id,device_map="cpu",dtype=torch.float32)
          supported=set(model.get_supported_speakers())
          speakers=["Ryan","Aiden"]
          assert all(s.lower() in {x.lower() for x in supported} for s in speakers), supported
          texts=[
            ("hook","Most people think the hardest part is getting started. It isn't. The hard part is knowing what deserves your attention."),
            ("contrast","At first, the result looked convincing. Then one small detail changed the entire story."),
            ("question","Would you notice the difference if nobody told you what to listen for?"),
            ("fact","The system finished the test in twelve seconds, but speed was not the result we cared about."),
            ("reveal","And this is where it gets interesting: the obvious answer was completely wrong."),
          ]
          rows=[]
          for sp in speakers:
            for case,text in texts:
              t=time.perf_counter()
              wavs,sr=model.generate_custom_voice(text=text,language="English",speaker=sp,instruct="Natural documentary narration. Human, conversational, restrained emotion. Avoid announcer delivery and exaggerated acting.")
              sec=time.perf_counter()-t
              fn=out/f"{sp.lower()}_{case}.wav"; sf.write(fn,wavs[0],sr,subtype="PCM_16")
              dur=len(wavs[0])/sr
              rows.append({"speaker":sp,"case":case,"audio":fn.name,"sha256":hashlib.sha256(fn.read_bytes()).hexdigest(),"synthesis_s":sec,"duration_s":dur,"rtf":sec/dur})
              print("SAMPLE",sp,case,round(sec,3),round(dur,3),round(sec/dur,3))
          (out/"manifest.json").write_text(json.dumps({"model":model_id,"upstream":"022e286b98fbec7e1e916cb940cdf532cd9f488e","samples":rows,"gpu":False,"paid":False,"production_changed":False},indent=2))
          print("SAMPLES=PASS",len(rows),"PEAK_RSS_KIB",resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m6-qwen3-male-human-likeness-${{ github.sha }}
          path: artifacts/m6/qwen3-male/
          if-no-files-found: error
          retention-days: 7
