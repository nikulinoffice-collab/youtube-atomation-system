name: M6 MOSS Nano CPU Synthesis One-Shot

on:
  push:
    branches:
      - factory-v1-voice-m6

permissions:
  contents: read

jobs:
  moss-cpu-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record runner resources
        run: |
          nproc
          free -m
          python --version
      - name: Clone pinned upstream
        run: |
          git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git /tmp/moss
          cd /tmp/moss
          git checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
          git rev-parse HEAD
      - name: Install CPU-only runtime stack
        run: |
          START=$(date +%s)
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0
          python -m pip install "onnxruntime>=1.20.0" numpy soundfile huggingface_hub sentencepiece
          echo "install_seconds=$(($(date +%s)-START))"
          python -m pip check
          python - <<'PY'
          import torch, torchaudio, onnxruntime as ort
          print('torch=', torch.__version__)
          print('torchaudio=', torchaudio.__version__)
          print('cuda_available=', torch.cuda.is_available())
          print('providers=', ort.get_available_providers())
          assert not torch.cuda.is_available()
          assert 'CPUExecutionProvider' in ort.get_available_providers()
          PY
      - name: Run real ONNX synthesis
        run: |
          cd /tmp/moss
          mkdir -p /tmp/m6-moss
          /usr/bin/time -v python infer_onnx.py \
            --prompt-audio-path assets/audio/en_2.wav \
            --text "Is AI really going to destroy us? The answer is more complicated than the headlines suggest." \
            --output-audio-path /tmp/m6-moss/sample.wav \
            --execution-provider cpu \
            2>&1 | tee /tmp/m6-moss/synthesis.log
          test -s /tmp/m6-moss/sample.wav
          python - <<'PY'
          import wave
          p='/tmp/m6-moss/sample.wav'
          with wave.open(p,'rb') as w:
              duration=w.getnframes()/float(w.getframerate())
              print('channels=',w.getnchannels())
              print('sample_rate=',w.getframerate())
              print('duration_seconds=',duration)
              assert duration > 0.25
          PY
