name: M6 Blind Listening Package One Shot
on:
  workflow_dispatch:
  push:
    branches: [factory-v1-voice-m6]
    paths: [.github/workflows/m6-blind-listening-package-one-shot.yml]
permissions:
  contents: read
  actions: read
jobs:
  build-blind-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-v1-voice-m6
      - name: Verify frozen corpus
        run: python scripts/m6_frozen_corpus_harness.py verify
      - name: Download exact benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p inputs/edge inputs/kokoro inputs/chatterbox
          gh api repos/$REPO/actions/artifacts/10583164523/zip > /tmp/edge.zip
          gh api repos/$REPO/actions/artifacts/10586710488/zip > /tmp/kokoro.zip
          gh api repos/$REPO/actions/artifacts/10590806967/zip > /tmp/chatterbox.zip
          unzip -q /tmp/edge.zip -d inputs/edge
          unzip -q /tmp/kokoro.zip -d inputs/kokoro
          unzip -q /tmp/chatterbox.zip -d inputs/chatterbox
      - name: Build and verify blind package
        run: |
          set -euo pipefail
          python scripts/m6_build_blind_package.py --inputs inputs --out m6-blind
          test "$(find m6-blind/review/audio -type f -name '*.wav' | wc -l)" -eq 36
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('m6-blind/review/blind_review_manifest.json').read_text())
          a=json.loads(Path('m6-blind/audit/blind_audit_binding.json').read_text())
          assert r['sample_count']==36 and a['sample_count']==36
          assert r['engine_names_exposed'] is False
          assert all('engine_id' not in x for x in r['samples'])
          assert len({x['sample_id'] for x in r['samples']})==36
          assert {x['sample_id'] for x in r['samples']}=={x['sample_id'] for x in a['bindings']}
          print('BLIND_PACKAGE=PASS samples=36')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m6-blind-review-${{ github.sha }}
          path: m6-blind/review/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: m6-blind-audit-map-${{ github.sha }}
          path: m6-blind/audit/
          if-no-files-found: error
          retention-days: 7
