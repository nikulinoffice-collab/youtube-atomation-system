name: M6.1 normalizer one-shot
on:
  workflow_dispatch:
  push:
    branches: [factory-v1-voice-m6]
    paths: [.github/workflows/m6-1-normalizer-one-shot.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run M6.1 tests
        run: python -m pytest -q tests/test_m6_voice_script.py
