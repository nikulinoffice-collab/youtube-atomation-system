name: M6 Edge Full Corpus One Shot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-frozen-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-v1-voice-m6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Edge benchmark runtime
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts==7.2.7'
          python -m pip check
      - name: Verify frozen corpus and synthesize shadow samples
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m6_frozen_corpus_harness.py verify
          mkdir -p m6-edge-full/audio m6-edge-full/records
          python - <<'PY'
          import asyncio, hashlib, json, subprocess, time
          from pathlib import Path
          import edge_tts

          root = Path('.')
          corpus = json.loads((root/'docs/m6/benchmark_corpus.json').read_text(encoding='utf-8'))
          manifest = json.loads((root/'docs/m6/frozen_corpus_manifest.json').read_text(encoding='utf-8'))
          expected = {x['id']: x['text_sha256'] for x in manifest['cases']}
          out = root/'m6-edge-full'
          voice = 'en-US-GuyNeural'
          rate = '+0%'
          engine_version = getattr(edge_tts, '__version__', '7.2.7')
          summary = []

          async def synth(text, path):
              comm = edge_tts.Communicate(text, voice=voice, rate=rate)
              await comm.save(str(path))

          for index, case in enumerate(corpus['cases']):
              cid, text = case['id'], case['text']
              actual = hashlib.sha256(text.encode('utf-8')).hexdigest()
              if actual != expected.get(cid):
                  raise SystemExit(f'source hash mismatch before synthesis: {cid}')
              mp3 = out/'audio'/f'{cid}.mp3'
              wav = out/'audio'/f'{cid}.wav'
              t0 = time.perf_counter()
              asyncio.run(synth(text, mp3))
              elapsed = time.perf_counter() - t0
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(mp3),'-acodec','pcm_s16le','-ar','24000','-ac','1',str(wav)], check=True)
              rec = out/'records'/f'{cid}.json'
              subprocess.run([
                  'python','scripts/m6_frozen_corpus_harness.py','bind',
                  '--case-id',cid,'--engine-id','edge-legacy',
                  '--engine-version-or-commit',engine_version,
                  '--config-json',json.dumps({'voice':voice,'rate':rate,'source_format':'mp3','bound_format':'pcm_s16le_wav'}),
                  '--audio',str(wav),'--synthesis-seconds',str(elapsed),
                  '--cold-or-warm','cold' if index == 0 else 'warm','--output',str(rec)
              ], check=True)
              record = json.loads(rec.read_text())
              summary.append({'case_id':cid,'synthesis_seconds':record['synthesis_seconds'],'audio_duration_seconds':record['audio_duration_seconds'],'rtf':record['rtf'],'cold_or_warm':record['cold_or_warm'],'audio_sha256':record['audio_sha256']})

          (out/'summary.json').write_text(json.dumps({'engine_id':'edge-legacy','engine_version':engine_version,'voice':voice,'rate':rate,'cases':summary},indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Verify bound records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records=list(Path('m6-edge-full/records').glob('*.json'))
          corpus=json.loads(Path('docs/m6/benchmark_corpus.json').read_text())
          assert len(records)==len(corpus['cases'])==12, (len(records),len(corpus['cases']))
          for p in records:
              r=json.loads(p.read_text())
              assert r['production_changed'] is False
              assert r['rtf'] > 0 and r['audio_duration_seconds'] > 0
          print('BOUND_RECORDS=PASS count=12')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m6-edge-full-corpus-${{ github.sha }}
          path: m6-edge-full/
          if-no-files-found: error
          retention-days: 7
