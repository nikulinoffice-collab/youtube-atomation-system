name: M6 Kokoro CPU Synthesis One-Shot

on:
  push:
    branches: [factory-v1-voice-m6]

permissions:
  contents: read

jobs:
  kokoro-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record runner resources
        run: |
          python --version
          nproc
          free -m
      - name: Install isolated Kokoro runtime
        run: |
          START=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" soundfile psutil
          python -m pip check
          echo "install_seconds=$(($(date +%s)-START))"
      - name: Verify CPU-only execution contract
        run: |
          python - <<'PY'
          import torch
          print('torch=', torch.__version__)
          print('cuda_available=', torch.cuda.is_available())
          assert not torch.cuda.is_available(), 'GPU/CUDA unexpectedly available'
          from kokoro import KPipeline
          print('kokoro_import=PASS')
          PY
      - name: Benchmark cold and warm synthesis
        run: |
          mkdir -p artifacts/m6/kokoro
          /usr/bin/time -v python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import psutil, soundfile as sf, torch
          from kokoro import KPipeline

          text = 'AI is changing everything — faster than most people realize.'
          case_id = 'hook'
          source_sha256 = hashlib.sha256(text.encode('utf-8')).hexdigest()
          outdir = Path('artifacts/m6/kokoro')
          proc = psutil.Process()
          t0 = time.perf_counter()
          pipeline = KPipeline(lang_code='a')
          init_seconds = time.perf_counter() - t0
          results=[]
          for run in range(1,4):
              start=time.perf_counter()
              chunks=[]
              for _, _, audio in pipeline(text, voice='af_heart', speed=1):
                  chunks.append(audio)
              synth=time.perf_counter()-start
              import numpy as np
              audio=np.concatenate(chunks)
              path=outdir/f'kokoro_{case_id}_run{run}.wav'
              sf.write(path, audio, 24000)
              info=sf.info(path)
              duration=info.frames/info.samplerate
              results.append({'run':run,'synthesis_seconds':synth,'audio_duration_seconds':duration,'rtf':synth/duration,'rss_bytes':proc.memory_info().rss,'artifact_bytes':path.stat().st_size})
          payload={'engine':'kokoro','package_version':'0.9.4','case_id':case_id,'source_sha256':source_sha256,'text':text,'voice':'af_heart','voice_rights_status':'NOT_COMMERCIAL_CERTIFIED_PENDING_EXPLICIT_VOICEPACK_RIGHTS','sample_rate_hz':24000,'cuda_available':torch.cuda.is_available(),'pipeline_init_seconds':init_seconds,'runs':results,'failures':0,'retries':0,'production_changed':False}
          (outdir/'kokoro_results.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY
      - name: Inspect artifacts
        run: |
          du -sh ~/.cache/huggingface || true
          ls -lh artifacts/m6/kokoro
          cat artifacts/m6/kokoro/kokoro_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: m6-kokoro-cpu-technical-only
          path: artifacts/m6/kokoro
          retention-days: 7
