name: M6 Qwen3 TTS Runtime Probe One Shot
on:
  workflow_dispatch:
  push:
    branches: [factory-v1-voice-m6]
    paths: [.github/workflows/m6-qwen3-tts-runtime-probe-one-shot.yml]
permissions:
  contents: read
jobs:
  qwen3-runtime-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-v1-voice-m6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Environment
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,platform
          print("PYTHON",platform.python_version())
          print("MACHINE",platform.machine())
          print("CPU_COUNT",os.cpu_count())
          PY
          free -m
      - name: Install CPU runtime and official Qwen3-TTS
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install git+https://github.com/QwenLM/Qwen3-TTS.git psutil soundfile
          python -m pip check
      - name: Fail closed on CUDA packages and inspect API
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata as md, inspect, torch
          assert not torch.cuda.is_available(), "GPU unexpectedly available"
          bad=[d.metadata["Name"] for d in md.distributions() if (d.metadata.get("Name") or "").lower().startswith(("nvidia-","cuda-"))]
          assert not bad, f"CUDA runtime packages present: {bad}"
          import qwen_tts
          print("QWEN_TTS",qwen_tts.__file__)
          print("TORCH",torch.__version__,"CUDA",torch.cuda.is_available())
          print("RUNTIME_IMPORT=PASS")
          PY
      - name: Probe official checkpoint metadata without synthesis
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import model_info
          candidates=[
            "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice",
            "Qwen/Qwen3-TTS-12Hz-0.6B-Base",
            "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice",
          ]
          found=[]
          for x in candidates:
            try:
              i=model_info(x)
              found.append((x,i.sha, i.card_data.license if i.card_data else None))
            except Exception as e:
              print("MISS",x,type(e).__name__)
          assert found, "No official Qwen3-TTS checkpoint resolved"
          for row in found: print("MODEL",*row)
          assert any((lic or "").lower()=="apache-2.0" for _,_,lic in found), found
          print("MODEL_METADATA=PASS")
          PY
      - name: Write technical probe summary
        run: |
          mkdir -p artifacts/m6/qwen3-probe
          cat > artifacts/m6/qwen3-probe/README.txt <<'EOF'
          M6.0 Qwen3-TTS technical runtime probe.
          No speech synthesis performed in this first gate.
          No reference voice used. No celebrity/public-figure voice used.
          No paid API, billing, secrets, publishing, or production change.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: m6-qwen3-tts-runtime-probe-${{ github.sha }}
          path: artifacts/m6/qwen3-probe/
          if-no-files-found: error
          retention-days: 7
