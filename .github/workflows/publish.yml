name: Factory V1 - Generate Draft Short

on:
  workflow_dispatch:
  push:
    branches:
      - factory-v1-storyboard

concurrency:
  group: factory-v1-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Compile production agents
        run: |
          python -m py_compile agents/script_agent.py agents/voice_agent.py agents/captions_agent.py agents/storyboard_agent.py agents/visuals_agent.py agents/visual_ranker.py agents/visuals_m53_agent.py agents/video_agent.py agents/qc_agent.py
      - name: Validate required free-tier API secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Missing required repository secret: GEMINI_API_KEY"; exit 1; fi
          if [ -z "$PEXELS_API_KEY" ]; then echo "Missing required repository secret: PEXELS_API_KEY"; exit 1; fi
      - name: Generate and QC draft video
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python script_agent.py
          python voice_agent.py
          python captions_agent.py
          python storyboard_agent.py
          python visuals_m53_agent.py
          python video_agent.py
          python qc_agent.py
      - name: Verify M5.1 visual direction contract
        run: |
          shopt -s nullglob
          storyboards=(agents/output/storyboard_[0-9]*.json); test ${#storyboards[@]} -gt 0
          python - "${storyboards[-1]}" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); scenes=d.get('scenes',[])
          assert d.get('schema_version')==3 and d.get('visual_direction_contract')=='m5.1'
          assert 8<=len(scenes)<=12
          for s in scenes:
              assert s.get('visual_goal') and 2<=len(s.get('must_show',[]))<=5 and 1<=len(s.get('avoid',[]))<=5
              assert s.get('subject') and s.get('action') and s.get('environment')
              assert 3<=len(s.get('query_strategies',[]))<=5
          print(f"M5.1 PASS: scenes={len(scenes)}")
          PY
      - name: Verify M5.2 retrieval invariants inside ranked manifest
        run: |
          shopt -s nullglob
          candidates=(agents/output/candidate_manifest_[0-9]*.json); storyboards=(agents/output/storyboard_[0-9]*.json)
          python - "${candidates[-1]}" "${storyboards[-1]}" <<'PY'
          import json,sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text()); s=json.loads(Path(sys.argv[2]).read_text())
          assert m['scene_count']==len(s['scenes'])==len(m['scenes'])
          p=m['retrieval_policy']; assert p['video_duration_must_cover_scene'] is True and p['minimum_portrait_width']>=540 and p['minimum_portrait_height']>=960
          total=eligible=0
          for scene,pool in zip(s['scenes'],m['scenes']):
              assert pool['scene_id']==scene['scene_id'] and 3<=len(pool['query_strategies'])<=5
              ids=[str(c['asset_id']) for c in pool['candidates']]; assert ids and len(ids)==len(set(ids))
              ok=[c for c in pool['candidates'] if c.get('technical_status')=='eligible']; assert ok
              total+=len(ids); eligible+=len(ok)
          assert total>len(s['scenes']); print(f"M5.2 retrieval PASS: candidates={total}, eligible={eligible}")
          PY
      - name: Verify M5.3 ranking and diversity contract
        run: |
          shopt -s nullglob
          candidates=(agents/output/candidate_manifest_[0-9]*.json); manifests=(agents/output/asset_manifest_[0-9]*.json); storyboards=(agents/output/storyboard_[0-9]*.json)
          python - "${candidates[-1]}" "${manifests[-1]}" "${storyboards[-1]}" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text()); a=json.loads(Path(sys.argv[2]).read_text()); s=json.loads(Path(sys.argv[3]).read_text())
          assert r.get('schema_version')==2 and r.get('milestone')=='M5.3'
          p=r['ranking_policy']; assert p['query_semantic_contribution_is_capped'] is True and p['candidate_specific_semantics']=='provider URL slug and creator metadata'
          assert p['generic_penalty'] and p['duplicate_penalty'] and p['global_diversity_penalty'] and p['image_content_claims'] is False
          assert a.get('schema_version')==3 and a.get('acquisition_strategy')=='semantic_ranked_with_global_diversity_penalties'
          seen=set(); cats=[]
          for scene,pool,asset in zip(s['scenes'],r['scenes'],a['assets']):
              ranked=pool['ranked_candidates']; assert ranked
              scores=[float(c['ranking']['final_score']) for c in ranked]; assert scores==sorted(scores,reverse=True)
              assert [int(c['ranking']['rank']) for c in ranked]==list(range(1,len(ranked)+1))
              for c in ranked:
                  q=c['ranking']; assert 0<=float(q['technical_score'])<=36 and 0<=float(q['semantic_score'])<=58 and float(q['penalty_total'])>=0 and q['reasons']
              sel=asset['selection']; assert sel['reasons'] and asset['asset_id'] not in seen; seen.add(asset['asset_id']); cats.append(sel['visual_category'])
              if asset['provider']=='pexels':
                  match=[c for c in ranked if c['asset_id']==asset['asset_id']]; assert match and int(sel['rank'])==int(match[0]['ranking']['rank'])
          maxrun=run=1
          for x,y in zip(cats,cats[1:]): run=run+1 if x==y else 1; maxrun=max(maxrun,run)
          assert maxrun<=2
          print(f"M5.3 PASS: scenes={len(cats)}, categories={cats}, max_same_category_run={maxrun}")
          PY
      - name: Verify M4 renderer and QC package
        run: |
          shopt -s nullglob
          qcs=(agents/output/qc_report_[0-9]*.json); renderers=(agents/output/renderer_manifest_[0-9]*.json); videos=(agents/output/final_[0-9]*.mp4)
          python - "${qcs[-1]}" "${renderers[-1]}" <<'PY'
          import json,sys
          from pathlib import Path
          q=json.loads(Path(sys.argv[1]).read_text()); r=json.loads(Path(sys.argv[2]).read_text())
          assert q.get('status')=='PASS' and r.get('strategy')=='storyboard_scene_start_cuts_with_previous_scene_pause_hold'
          assert 8<=len(r.get('segments',[]))<=12
          print(f"M4 PASS: scenes={len(r['segments'])}")
          PY
          test ${#videos[@]} -gt 0
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "${videos[-1]}"
      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-v1-run-${{ github.run_number }}
          path: agents/output/
          if-no-files-found: warn
          retention-days: 7