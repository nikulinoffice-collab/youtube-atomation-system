name: Factory V1 - Generate Draft Short

on:
  workflow_dispatch:

concurrency:
  group: factory-v1-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Compile production agents
        run: |
          python -m py_compile \
            agents/script_agent.py \
            agents/voice_agent.py \
            agents/captions_agent.py \
            agents/storyboard_agent.py \
            agents/visuals_agent.py \
            agents/video_agent.py

      - name: Validate required free-tier API secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing required repository secret: GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Missing required repository secret: PEXELS_API_KEY"
            exit 1
          fi

      - name: Generate draft video
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python script_agent.py
          python voice_agent.py
          python captions_agent.py
          python storyboard_agent.py
          python visuals_agent.py
          python video_agent.py

      - name: Verify M2 storyboard artifact
        run: |
          shopt -s nullglob
          storyboards=(agents/output/storyboard_[0-9]*.json)
          if [ ${#storyboards[@]} -eq 0 ]; then
            echo "No storyboard JSON was produced."
            exit 1
          fi
          python - "${storyboards[-1]}" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          scenes = data.get("scenes", [])
          assert data.get("schema_version") == 2
          assert data.get("timing_strategy") == "deterministic_dp"
          assert 8 <= len(scenes) <= 12
          assert data.get("scene_count") == len(scenes)
          assert scenes[0]["start_word"] == 0
          for scene in scenes:
              assert 1.2 - 1e-6 <= float(scene["duration"]) <= 6.0 + 1e-6
              assert len(scene.get("search_queries", [])) >= 2
              assert scene.get("visual_intent")
          for left, right in zip(scenes, scenes[1:]):
              assert right["start_word"] == left["end_word"] + 1
              assert right["start"] >= left["end"] - 1e-6
          print(f"Validated deterministic storyboard: {path.name}, scenes={len(scenes)}")
          PY

      - name: Verify final MP4 exists
        run: |
          shopt -s nullglob
          videos=(agents/output/final_*.mp4)
          if [ ${#videos[@]} -eq 0 ]; then
            echo "No final MP4 was produced."
            exit 1
          fi
          echo "Final video: ${videos[-1]}"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "${videos[-1]}"

      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-v1-run-${{ github.run_number }}
          path: agents/output/
          if-no-files-found: warn
          retention-days: 7
