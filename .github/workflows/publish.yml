name: Factory V1 - Generate Draft Short

on:
  workflow_dispatch:

concurrency:
  group: factory-v1-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Validate required free-tier API secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing required repository secret: GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Missing required repository secret: PEXELS_API_KEY"
            exit 1
          fi

      - name: Generate draft video
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python script_agent.py
          python voice_agent.py
          python visuals_agent.py
          python captions_agent.py
          python video_agent.py

      - name: Verify final MP4 exists
        run: |
          shopt -s nullglob
          videos=(agents/output/final_*.mp4)
          if [ ${#videos[@]} -eq 0 ]; then
            echo "No final MP4 was produced."
            exit 1
          fi
          echo "Final video: ${videos[-1]}"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "${videos[-1]}"

      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-v1-run-${{ github.run_number }}
          path: agents/output/
          if-no-files-found: warn
          retention-days: 7
