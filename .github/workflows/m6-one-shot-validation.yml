name: M6 One-Shot Benchmark Validation

on:
  push:
    branches:
      - factory-v1-voice-m6

permissions:
  contents: read

jobs:
  validate-m6-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile benchmark harness and tests
        run: |
          python -m py_compile scripts/m6_benchmark_harness.py tests/test_m6_benchmark_harness.py

      - name: Run M6 benchmark harness regression tests
        run: |
          python -m pytest -q tests/test_m6_benchmark_harness.py

      - name: Generate benchmark manifest
        run: |
          python scripts/m6_benchmark_harness.py
