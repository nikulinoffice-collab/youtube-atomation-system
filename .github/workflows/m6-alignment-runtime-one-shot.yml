name: M6 Alignment Runtime One-Shot

on:
  push:
    branches: [factory-v1-voice-m6]
    paths:
      - '.github/workflows/m6-alignment-runtime-one-shot.yml'

permissions:
  contents: read

jobs:
  benchmark-whisperx-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact triggering revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost alignment runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check 'whisperx==3.8.6'
      - name: Benchmark English forced alignment on CPU
        run: |
          set -euo pipefail
          mkdir -p artifacts/m6.7-alignment-runtime
          espeak-ng -v en-us -s 155 -w artifacts/m6.7-alignment-runtime/sample.wav 'Revenue reached two point four billion dollars in twenty twenty six.'
          /usr/bin/time -v python - <<'PY' 2>artifacts/m6.7-alignment-runtime/time.txt | tee artifacts/m6.7-alignment-runtime/result.json
          import importlib.metadata, json, platform, time, wave
          import torch, whisperx
          audio_path = 'artifacts/m6.7-alignment-runtime/sample.wav'
          audio = whisperx.load_audio(audio_path)
          with wave.open(audio_path, 'rb') as w:
              source_duration = w.getnframes() / w.getframerate()
          transcript = 'Revenue reached two point four billion dollars in twenty twenty six.'
          segments = [{'start': 0.0, 'end': source_duration, 'text': transcript}]
          t0 = time.perf_counter()
          model_a, metadata = whisperx.load_align_model(language_code='en', device='cpu')
          load_s = time.perf_counter() - t0
          t1 = time.perf_counter()
          result = whisperx.align(segments, model_a, metadata, audio, 'cpu', return_char_alignments=False)
          align_s = time.perf_counter() - t1
          words = result.get('word_segments', [])
          assert words, 'forced aligner returned no word timings'
          assert all(w.get('start') is not None and w.get('end') is not None for w in words), 'missing word timing'
          assert all(words[i]['start'] <= words[i]['end'] <= words[i+1]['start'] for i in range(len(words)-1)), 'non-monotonic timings'
          evidence = {
              'schema_version': 'm6.7-alignment-runtime.v1',
              'git_sha': __import__('os').environ['GITHUB_SHA'],
              'dependency': 'whisperx',
              'dependency_version': importlib.metadata.version('whisperx'),
              'dependency_license': 'BSD-2-Clause',
              'device': 'cpu',
              'python': platform.python_version(),
              'torch': torch.__version__,
              'source_audio_seconds': round(source_duration, 6),
              'model_load_seconds': round(load_s, 6),
              'alignment_seconds': round(align_s, 6),
              'alignment_rtf': round(align_s / source_duration, 6),
              'word_count': len(words),
              'first_word': words[0],
              'last_word': words[-1],
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: m6.7-alignment-runtime-${{ github.sha }}
          path: artifacts/m6.7-alignment-runtime/
          if-no-files-found: error
          retention-days: 30
