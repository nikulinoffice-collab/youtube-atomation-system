name: M6 MOSS Nano Warm Benchmark One-Shot

on:
  push:
    branches:
      - factory-v1-voice-m6

permissions:
  contents: read

jobs:
  moss-warm-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record runner resources
        run: |
          nproc
          free -m
          df -h /
          python --version
      - name: Clone pinned upstream
        run: |
          git clone https://github.com/OpenMOSS/MOSS-TTS-Nano.git /tmp/moss
          cd /tmp/moss
          git checkout 8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb
          test "$(git rev-parse HEAD)" = "8b7bcc9341b3b4ef3a3a58ba1338a7d85ff133eb"
      - name: Install CPU-only runtime stack
        run: |
          START=$(date +%s)
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0
          python -m pip install "onnxruntime>=1.20.0" numpy soundfile huggingface_hub sentencepiece
          python -m pip install pynini==2.1.6.post1
          python -m pip install git+https://github.com/WhizZest/WeTextProcessing.git@bb145729c903fac2d9fddf6b9077f352f3fc2816
          echo "install_seconds=$(($(date +%s)-START))"
          python -m pip check
          python - <<'PY'
          import torch, onnxruntime as ort
          from tn.english.normalizer import Normalizer as EnNormalizer
          print('torch=', torch.__version__)
          print('cuda_available=', torch.cuda.is_available())
          print('providers=', ort.get_available_providers())
          assert not torch.cuda.is_available()
          assert 'CPUExecutionProvider' in ort.get_available_providers()
          assert EnNormalizer is not None
          PY
          if python -m pip freeze | grep -Ei '^(nvidia-|triton==|cuda)' ; then
            echo 'Unexpected CUDA/NVIDIA runtime package installed' >&2
            exit 1
          fi
      - name: Prime models and normalization cache
        run: |
          cd /tmp/moss
          mkdir -p /tmp/m6-moss
          /usr/bin/time -v -o /tmp/m6-moss/cold.time python infer_onnx.py \
            --prompt-audio-path assets/audio/en_2.wav \
            --text "Is AI really going to destroy us? The answer is more complicated than the headlines suggest." \
            --output-audio-path /tmp/m6-moss/cold.wav \
            --execution-provider cpu
          test -s /tmp/m6-moss/cold.wav
          du -sh models || true
      - name: Measure warm synthesis runs
        run: |
          cd /tmp/moss
          python - <<'PY'
          import json, subprocess, time, wave, re, statistics, os
          text = 'Is AI really going to destroy us? The answer is more complicated than the headlines suggest.'
          rows=[]
          for i in range(1,4):
              wav=f'/tmp/m6-moss/warm_{i}.wav'
              tf=f'/tmp/m6-moss/warm_{i}.time'
              cmd=['/usr/bin/time','-v','-o',tf,'python','infer_onnx.py','--prompt-audio-path','assets/audio/en_2.wav','--text',text,'--output-audio-path',wav,'--execution-provider','cpu']
              t0=time.perf_counter()
              subprocess.run(cmd, check=True)
              elapsed=time.perf_counter()-t0
              with wave.open(wav,'rb') as w:
                  duration=w.getnframes()/float(w.getframerate())
                  channels=w.getnchannels(); sr=w.getframerate()
              report=open(tf,encoding='utf-8').read()
              m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', report)
              peak_kb=int(m.group(1)) if m else None
              row={'run':i,'elapsed_seconds':elapsed,'audio_duration_seconds':duration,'rtf':elapsed/duration,'peak_rss_kb':peak_kb,'channels':channels,'sample_rate':sr,'artifact_bytes':os.path.getsize(wav)}
              rows.append(row)
              print(json.dumps(row,sort_keys=True))
          summary={'runs':rows,'mean_elapsed_seconds':statistics.mean(r['elapsed_seconds'] for r in rows),'mean_audio_duration_seconds':statistics.mean(r['audio_duration_seconds'] for r in rows),'mean_rtf':statistics.mean(r['rtf'] for r in rows),'max_peak_rss_kb':max(r['peak_rss_kb'] for r in rows if r['peak_rss_kb'] is not None),'gpu':False,'technical_only_not_commercial_certified':True}
          print('M6_MOSS_WARM_SUMMARY='+json.dumps(summary,sort_keys=True))
          open('/tmp/m6-moss/warm_results.json','w').write(json.dumps(summary,indent=2,sort_keys=True))
          assert all(r['audio_duration_seconds'] > 0.25 for r in rows)
          assert all(r['rtf'] > 0 for r in rows)
          PY
      - name: Show cold-path evidence
        run: |
          cat /tmp/m6-moss/cold.time
          python - <<'PY'
          import wave
          with wave.open('/tmp/m6-moss/cold.wav','rb') as w:
              print('cold_audio_duration_seconds=',w.getnframes()/float(w.getframerate()))
              print('cold_sample_rate=',w.getframerate())
              print('cold_channels=',w.getnchannels())
          PY
