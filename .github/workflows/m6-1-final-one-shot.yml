name: M6.1 final one-shot
on:
  push:
    branches: [factory-v1-voice-m6]
    paths:
      - '.github/workflows/m6-1-final-one-shot.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_m6_voice_script.py
