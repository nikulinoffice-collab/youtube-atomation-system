name: M6 Edge One-Shot Benchmark

on:
  push:
    branches:
      - factory-v1-voice-m6

permissions:
  contents: read

jobs:
  edge-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install "edge-tts>=6.1.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Record runner resources
        run: |
          nproc
          free -m
          ffprobe -version | head -1
      - name: Run Edge shadow benchmark
        run: python scripts/m6_edge_benchmark.py
      - name: Verify report invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/m6/edge/edge_results.json').read_text())
          assert d['production_changed'] is False
          assert d['paid_services_used'] is False
          assert len(d['samples']) == 24
          assert all(s['failure'] is None for s in d['samples'])
          assert all(s['measurement']['gpu_used'] is False for s in d['samples'])
          assert all(s['measurement']['audio_duration_seconds'] > 0 for s in d['samples'])
          print('PASS: 24/24 Edge samples and measurements complete')
          PY
      - name: Upload blind Edge benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: m6-edge-benchmark-${{ github.sha }}
          path: artifacts/m6/edge/
          retention-days: 7
