name: M6.4 Qwen3 Runtime One Shot

on:
  push:
    branches:
      - factory-v1-voice-m6
    paths:
      - '.github/workflows/m6-qwen3-runtime-one-shot.yml'

permissions:
  contents: read

jobs:
  qualify-real-qwen3-ryan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
      - name: Verify exact revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Qwen3 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'qwen-tts==0.1.1' numpy
      - name: Run one real Ryan synthesis
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/m6_qwen3_runtime_qualify.py
      - name: Upload bound runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-4-qwen3-ryan-runtime-${{ github.sha }}
          path: artifacts/m6_4_runtime/
          if-no-files-found: warn
          retention-days: 7
