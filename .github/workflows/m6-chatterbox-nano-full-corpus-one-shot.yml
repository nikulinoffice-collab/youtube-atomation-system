name: M6 Chatterbox Nano Full Corpus One Shot

on:
  workflow_dispatch:
  push:
    branches:
      - factory-v1-voice-m6
    paths:
      - .github/workflows/m6-chatterbox-nano-full-corpus-one-shot.yml

permissions:
  contents: read

jobs:
  chatterbox-nano-frozen-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-v1-voice-m6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Chatterbox Nano CPU runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0' 'torchaudio==2.6.0'
          python -m pip install --disable-pip-version-check 'git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2' psutil soundfile
          python -m pip check
      - name: Verify exact Nano API and frozen corpus
        run: |
          python scripts/m6_frozen_corpus_harness.py verify
          python - <<'PY'
          import inspect
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          sig=inspect.signature(ChatterboxTurboTTS.from_pretrained)
          print(sig)
          if 'nano' not in sig.parameters:
              raise SystemExit('fail closed: upstream API has no nano selector')
          PY
      - name: Synthesize shadow samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m6-chatterbox-nano-full/audio m6-chatterbox-nano-full/records
          /usr/bin/time -v python - <<'PY' 2>m6-chatterbox-nano-full/process-time.txt
          import hashlib, json, subprocess, time
          from pathlib import Path
          import torch, torchaudio
          from chatterbox.tts_turbo import ChatterboxTurboTTS

          root=Path('.')
          corpus=json.loads((root/'docs/m6/benchmark_corpus.json').read_text())
          manifest=json.loads((root/'docs/m6/frozen_corpus_manifest.json').read_text())
          expected={x['id']:x['text_sha256'] for x in manifest['cases']}
          out=root/'m6-chatterbox-nano-full'
          if torch.cuda.is_available():
              raise SystemExit('fail closed: GPU unexpectedly available')
          t0=time.perf_counter()
          model=ChatterboxTurboTTS.from_pretrained(device='cpu', nano=True)
          init=time.perf_counter()-t0
          model_name=type(model).__name__
          if getattr(model,'model_label',None) != 'Nano':
              raise SystemExit(f'fail closed: expected Nano model_label, got {getattr(model,"model_label",None)!r}')
          sr=int(model.sr)
          summary=[]
          for index,case in enumerate(corpus['cases']):
              cid,text=case['id'],case['text']
              if hashlib.sha256(text.encode()).hexdigest()!=expected.get(cid):
                  raise SystemExit(f'source hash mismatch: {cid}')
              t0=time.perf_counter()
              wav=model.generate(text)
              elapsed=time.perf_counter()-t0
              if wav is None or wav.numel()==0:
                  raise SystemExit(f'no audio: {cid}')
              wav=wav.detach().cpu()
              if wav.ndim==1: wav=wav.unsqueeze(0)
              path=out/'audio'/f'{cid}.wav'
              torchaudio.save(str(path),wav,sr,encoding='PCM_S',bits_per_sample=16)
              rec=out/'records'/f'{cid}.json'
              subprocess.run([
                'python','scripts/m6_frozen_corpus_harness.py','bind',
                '--case-id',cid,'--engine-id','chatterbox_nano',
                '--engine-version-or-commit','5de7a54aa4e5e2baadb0182dde554908b48b85c2',
                '--config-json',json.dumps({'nano':True,'device':'cpu','sample_rate':sr,'format':'pcm_s16le_wav','reference_voice':'builtin_default'},sort_keys=True),
                '--audio',str(path),'--synthesis-seconds',str(elapsed),
                '--cold-or-warm','cold' if index==0 else 'warm','--output',str(rec)
              ],check=True)
              r=json.loads(rec.read_text())
              summary.append({k:r[k] for k in ('case_id','synthesis_seconds','audio_duration_seconds','rtf','cold_or_warm','audio_sha256')})
          (out/'summary.json').write_text(json.dumps({'engine_id':'chatterbox_nano','upstream_commit':'5de7a54aa4e5e2baadb0182dde554908b48b85c2','model_class':model_name,'model_label':getattr(model,'model_label',None),'init_seconds':init,'sample_rate':sr,'cpu_only':True,'cuda_available':False,'cases':summary},indent=2,sort_keys=True)+'\n')
          print('MODEL_CLASS',model_name,'INIT_SECONDS',init,'SAMPLE_RATE',sr)
          print(json.dumps(summary,indent=2))
          PY
      - name: Verify bound records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records=list(Path('m6-chatterbox-nano-full/records').glob('*.json'))
          assert len(records)==12,len(records)
          for p in records:
              r=json.loads(p.read_text())
              assert r['production_changed'] is False
              assert r['rtf']>0 and r['audio_duration_seconds']>0
          print('BOUND_RECORDS=PASS count=12')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m6-chatterbox-nano-full-corpus-${{ github.sha }}
          path: m6-chatterbox-nano-full/
          if-no-files-found: error
          retention-days: 7
