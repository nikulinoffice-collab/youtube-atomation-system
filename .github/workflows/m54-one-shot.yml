name: M5.4 One Shot Certification

on:
  push:
    branches:
      - factory-v1-storyboard
    paths:
      - '.github/workflows/m54-one-shot.yml'
      - 'agents/visuals_m53_agent.py'
      - 'agents/video_agent.py'

permissions:
  contents: read

jobs:
  certify-m54:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Compile production agents
        run: |
          python -m py_compile \
            agents/script_agent.py \
            agents/voice_agent.py \
            agents/captions_agent.py \
            agents/storyboard_agent.py \
            agents/visuals_agent.py \
            agents/visual_ranker.py \
            agents/visuals_m53_agent.py \
            agents/video_agent.py \
            agents/qc_agent.py
      - name: Generate non-publishing draft
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python script_agent.py
          python voice_agent.py
          python captions_agent.py
          python storyboard_agent.py
          python visuals_m53_agent.py
          python video_agent.py
          python qc_agent.py
      - name: Verify M5.4 contract
        run: |
          shopt -s nullglob
          storyboards=(agents/output/storyboard_[0-9]*.json)
          assets=(agents/output/asset_manifest_[0-9]*.json)
          renderers=(agents/output/renderer_manifest_[0-9]*.json)
          qcs=(agents/output/qc_report_[0-9]*.json)
          videos=(agents/output/final_[0-9]*.mp4)
          test ${#storyboards[@]} -gt 0
          test ${#assets[@]} -gt 0
          test ${#renderers[@]} -gt 0
          test ${#qcs[@]} -gt 0
          test ${#videos[@]} -gt 0
          python - "${storyboards[-1]}" "${assets[-1]}" "${renderers[-1]}" "${qcs[-1]}" <<'PY'
          import json, sys
          from pathlib import Path
          storyboard = json.loads(Path(sys.argv[1]).read_text())
          assets = json.loads(Path(sys.argv[2]).read_text())
          renderer = json.loads(Path(sys.argv[3]).read_text())
          qc = json.loads(Path(sys.argv[4]).read_text())
          allowed = {'static','slow_push_in','slow_pull_out','pan_left','pan_right'}
          assert 8 <= len(storyboard['scenes']) <= 12
          assert assets.get('schema_version') == 4
          assert assets.get('motion_contract')
          assert len(assets['assets']) == len(storyboard['scenes'])
          for scene, asset in zip(storyboard['scenes'], assets['assets']):
              assert asset['scene_id'] == scene['scene_id']
              assert asset.get('preferred_motion') in allowed
              if asset.get('provider') == 'source_article':
                  assert asset['preferred_motion'] == 'static'
          assert renderer.get('schema_version') == 2
          assert renderer.get('milestone') == 'M5.4'
          assert renderer.get('source_card_strategy') == 'concise_caption_safe_mobile_card'
          policy = renderer.get('motion_policy', {})
          assert set(policy.get('allowed_still_motions', [])) == allowed
          assert policy.get('video_policy') == 'preserve_native_motion'
          assert policy.get('source_card_policy') == 'static_for_readability'
          segments = renderer['segments']
          assert len(segments) == len(assets['assets'])
          for asset, segment in zip(assets['assets'], segments):
              assert segment['asset_id'] == asset['asset_id']
              assert segment['preferred_motion'] == asset['preferred_motion']
              expected = 'native_video' if asset['type'] == 'video' else asset['preferred_motion']
              assert segment['resolved_motion'] == expected
          assert qc.get('status') == 'PASS'
          print('M5.4 PASS', {'scenes': len(segments), 'motions': [s['resolved_motion'] for s in segments]})
          PY
          ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of json "${videos[-1]}"
      - name: Upload one-shot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m54-one-shot-${{ github.run_number }}
          path: agents/output/
          retention-days: 7
